# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technology-fintech-market-intelligence"
version = "0.1.0"
description = "AI/ML/DL/NLP-based multi-company market analysis, regime discovery and forecasting for technology & fintech equities using yfinance and local MongoDB."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "market-intelligence",
    "fintech",
    "technology",
    "regime-detection",
    "forecasting",
    "yfinance",
    "mongodb",
    "streamlit",
    "machine-learning",
    "deep-learning",
    "nlp"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.36",
    "pymongo>=4.6.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "catboost>=1.2.0",
    "torch>=2.1.0",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "sentence-transformers>=2.2.2",
    "ta>=0.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "streamlit>=1.29.0",
    "streamlit-option-menu>=0.3.6",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "pytz>=2023.3",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ipykernel>=6.27.0",
    "jupyterlab>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/technology-fintech-market-intelligence"
Documentation = "https://github.com/yourusername/technology-fintech-market-intelligence#readme"
Repository = "https://github.com/yourusername/technology-fintech-market-intelligence"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "app*"]
exclude = ["tests*", "notebooks*", "data*", "reports*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "config", "app"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"